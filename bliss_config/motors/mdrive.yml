# MDrive motors of the Xeuss 2.0, generated 2026-10-20 from SPEC's config and settings
# (/usr/local/lib/spec.d/saxs/config, settings decoded by ~/bliss/local/spec_reference/read_spec_settings.py).
# Not connected now, so not configured: rx (R), ry (S), phi (T).
# read_only: false since 2026-10-20 (set true to block all moves again). detz: known hardware problem, may not physically move.
# Limits are DIAL limits (as SPEC). velocity = SPEC slew/steps, acceleration = velocity/(SPEC accel ms).
# Offsets are not YAML settings: set once from SPEC (see HANDOFF), stored by BLISS in Redis.
- controller:
    class: MDrive
    package: xeuss_bliss.mdrive
    plugin: emotion
    serial:
      url: /dev/ttyUSB0
      baudrate: 9600
    read_only: false   # moves enabled 2026-10-20 after tests (s1bot, detz comms, x direction confirmed by user)
    axes:
      - name: s1bot
        device_name: A
        steps_per_unit: 102400
        sign: 1
        velocity: 0.75
        acceleration: 6
        low_limit: -11
        high_limit: 11
        unit: mm
        # SPEC: base rate 100 steps/s, backlash -12800 steps, user offset 0.351641
        base_rate: 100
        backlash: -0.125
        backlash_is_dial: true
      - name: s1top
        device_name: B
        steps_per_unit: 102400
        sign: -1
        velocity: 0.75
        acceleration: 6
        low_limit: -11
        high_limit: 11
        unit: mm
        # SPEC: base rate 100 steps/s, backlash 12800 steps, user offset -0.397158
        base_rate: 100
        backlash: 0.125
        backlash_is_dial: true
      - name: s1hl
        device_name: C
        steps_per_unit: 102400
        sign: -1
        velocity: 0.75
        acceleration: 6
        low_limit: -11
        high_limit: 11
        unit: mm
        # SPEC: base rate 100 steps/s, backlash 12800 steps, user offset -0.912129
        base_rate: 100
        backlash: 0.125
        backlash_is_dial: true
      - name: s1hr
